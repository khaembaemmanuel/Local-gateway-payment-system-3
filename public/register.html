  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Saira', sans-serif;
    }

    body {
      background-color: #f8fafc;
      color: #334155;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .registration-container {
      background: #ffffff;
      width: 100%;
      max-width: 650px;
      padding: 35px 40px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      position: relative;
    }

    /* Close Icon */
    .close-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 20px;
      color: #94a3b8;
      text-decoration: none;
      transition: color 0.2s;
    }

    .close-btn:hover {
      color: #0f172a;
    }

    /* Title */
    .registration-container h2 {
      font-size: 32px;
      color: #2b3a4a;
      font-weight: 700;
      margin-top: 15px;
      margin-bottom: 30px;
    }

    /* Form Layout */
    .form-row {
      display: grid;
      grid-template-columns: 180px 1fr;
      align-items: center;
      margin-bottom: 18px;
      gap: 15px;
    }

    .form-row.textarea-row {
      align-items: start;
    }

    .form-row label {
      font-size: 15px;
      color: #475569;
      font-weight: 500;
    }

    .form-row input,
    .form-row select,
    .form-row textarea {
      width: 100%;
      padding: 10px 14px;
      font-size: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      outline: none;
      color: #1e293b;
      background-color: #ffffff;
      transition: border-color 0.2s;
    }

    /* Phone Input Container */
    .phone-input-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .phone-prefix {
      background-color: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 600;
      color: #475569;
      min-width: 65px;
      text-align: center;
      user-select: none;
    }

    .form-row input:focus,
    .form-row select:focus,
    .form-row textarea:focus {
      border-color: #0284c7;
    }

    .form-row textarea {
      height: 110px;
      resize: vertical;
    }

    /* Register Button Container */
    .btn-container {
      display: flex;
      justify-content: flex-start;
      margin-top: 25px;
    }

    .btn-register {
      background-color: #00b074;
      color: #ffffff;
      border: none;
      padding: 12px 30px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: background 0.2s;
      text-transform: uppercase;
    }

    .btn-register:hover {
      background-color: #009663;
    }

    /* Alert Message Box */
    .alert-message {
      display: none;
      padding: 12px;
      border-radius: 4px;
      font-size: 14px;
      margin-bottom: 20px;
      text-align: center;
    }

    .alert-danger {
      background-color: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .alert-success {
      background-color: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    /* Responsive Design */
    @media (max-width: 580px) {
      .form-row {
        grid-template-columns: 1fr;
        gap: 6px;
      }
    }
  </style>

  <script>
    const registerForm = document.getElementById('registerForm');
    const alertBox = document.getElementById('alertBox');
    const registerBtn = document.getElementById('registerBtn');
    const countrySelect = document.getElementById('country');
    const phonePrefix = document.getElementById('phonePrefix');
    const phoneInput = document.getElementById('phone');
    const currencySelect = document.getElementById('currency');
    const dobInput = document.getElementById('dob');

    // Automatically set max attribute on Date of Birth so users must be at least 23 years old from today
    const today = new Date();
    const targetYear = today.getFullYear() - 23;
    const targetMonth = String(today.getMonth() + 1).padStart(2, '0');
    const targetDay = String(today.getDate()).padStart(2, '0');
    dobInput.setAttribute('max', `${targetYear}-${targetMonth}-${targetDay}`);

    // Automatically update country code prefix, digit length, placeholder, and currency when country changes
    countrySelect.addEventListener('change', (e) => {
      const selectedOption = countrySelect.options[countrySelect.selectedIndex];
      const code = selectedOption.getAttribute('data-code');
      const currency = selectedOption.getAttribute('data-currency');
      const digits = selectedOption.getAttribute('data-digits');
      const placeholder = selectedOption.getAttribute('data-placeholder');

      // Update phone prefix box
      phonePrefix.textContent = code || '+---';

      // Enable phone input and set validation constraints
      if (code) {
        phoneInput.disabled = false;
        phoneInput.setAttribute('maxlength', digits);
        phoneInput.setAttribute('placeholder', placeholder || 'Enter phone number');
        phoneInput.title = `Please enter exactly ${digits} digits for this country`;
        phoneInput.value = ''; // Clear previous input on country switch
      } else {
        phoneInput.disabled = true;
        phoneInput.placeholder = 'Select a country first';
      }

      // Automatically preselect matching currency if available in the dropdown
      if (currency) {
        let currencyOptionExists = false;
        for (let i = 0; i < currencySelect.options.length; i++) {
          if (currencySelect.options[i].value === currency) {
            currencySelect.value = currency;
            currencyOptionExists = true;
            break;
          }
        }
        // If the currency isn't in the default dropdown list, dynamically add it
        if (!currencyOptionExists) {
          const newOpt = document.createElement('option');
          newOpt.value = currency;
          newOpt.textContent = currency;
          currencySelect.appendChild(newOpt);
          currencySelect.value = currency;
        }
      }
    });

    // Enforce dynamic numeric digits input based on selected country's required length
    phoneInput.addEventListener('input', (e) => {
      const selectedOption = countrySelect.options[countrySelect.selectedIndex];
      const maxDigits = parseInt(selectedOption.getAttribute('data-digits')) || 15;
      phoneInput.value = phoneInput.value.replace(/\D/g, '').slice(0, maxDigits);
    });

    function showAlert(message, type = 'danger') {
      alertBox.textContent = message;
      alertBox.className = `alert-message alert-${type}`;
      alertBox.style.display = 'block';
    }

    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      // Validate exact phone digit length before submitting
      const selectedOption = countrySelect.options[countrySelect.selectedIndex];
      const expectedDigits = parseInt(selectedOption.getAttribute('data-digits'));
      const rawPhone = phoneInput.value.trim();

      if (expectedDigits && rawPhone.length !== expectedDigits) {
        showAlert(`Phone number for this country must be exactly ${expectedDigits} digits.`);
        phoneInput.focus();
        return;
      }

      // Validate that age is at least 23 years old
      const dobValue = new Date(dobInput.value);
      const todayDate = new Date();
      let age = todayDate.getFullYear() - dobValue.getFullYear();
      const m = todayDate.getMonth() - dobValue.getMonth();
      
      if (m < 0 || (m === 0 && todayDate.getDate() < dobValue.getDate())) {
        age--;
      }

      if (age < 23) {
        showAlert('You must be at least 23 years old to register.');
        dobInput.focus();
        return;
      }

      const prefix = phonePrefix.textContent;
      const fullPhoneNumber = prefix + rawPhone;

      const formData = {
        firstName: document.getElementById('firstName').value.trim(),
        lastName: document.getElementById('lastName').value.trim(),
        email: document.getElementById('email').value.trim(),
        country: countrySelect.value,
        phone: fullPhoneNumber,
        gender: document.getElementById('gender').value,
        dob: dobInput.value,
        address: document.getElementById('address').value.trim(),
        accountType: document.getElementById('accountType').value,
        currency: currencySelect.value,
        password: document.getElementById('password').value
      };

      registerBtn.disabled = true;
      registerBtn.textContent = 'Processing...';

      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(formData)
        });

        const data = await response.json();

        if (response.ok) {
          showAlert('Registration successful! Redirecting to login...', 'success');
          setTimeout(() => {
            window.location.href = '/login.html';
          }, 1500);
        } else {
          showAlert(data.message || 'Registration failed. Please check your details.');
          registerBtn.disabled = false;
          registerBtn.textContent = 'REGISTER';
        }
      } catch (err) {
        console.error('Registration Error:', err);
        showAlert('Unable to connect to the server. Please try again later.');
        registerBtn.disabled = false;
        registerBtn.textContent = 'REGISTER';
      }
    });
  </script>
