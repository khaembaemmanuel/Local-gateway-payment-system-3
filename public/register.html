<!DOCTYPE html>
<html lang="en">
<head>
  
  <meta name="robots" content="noindex">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>International Banking Registration | Swift Royal Capital Bank</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Saira', sans-serif;
    }

    body {
      background-color: #f8fafc;
      color: #334155;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .registration-container {
      background: #ffffff;
      width: 100%;
      max-width: 650px;
      padding: 35px 40px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 20px;
      color: #94a3b8;
      text-decoration: none;
      transition: color 0.2s;
    }

    .close-btn:hover {
      color: #0f172a;
    }

    .registration-container h2 {
      font-size: 32px;
      color: #2b3a4a;
      font-weight: 700;
      margin-top: 15px;
      margin-bottom: 30px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 180px 1fr;
      align-items: center;
      margin-bottom: 18px;
      gap: 15px;
    }

    .form-row.textarea-row {
      align-items: start;
    }

    .form-row label {
      font-size: 15px;
      color: #475569;
      font-weight: 500;
    }

    .form-row input,
    .form-row select,
    .form-row textarea {
      width: 100%;
      padding: 10px 14px;
      font-size: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      outline: none;
      color: #1e293b;
      background-color: #ffffff;
      transition: border-color 0.2s;
    }

    .searchable-select-container {
      position: relative;
      width: 100%;
    }

    .country-search-input {
      font-size: 15px !important;
      font-weight: 500;
    }

    .country-dropdown-list {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      max-height: 220px;
      overflow-y: auto;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-top: none;
      border-radius: 0 0 4px 4px;
      z-index: 1000;
      display: none;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .country-option {
      padding: 10px 14px;
      font-size: 14px;
      cursor: pointer;
      color: #1e293b;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background-color 0.15s;
    }

    .country-option:hover {
      background-color: #f1f5f9;
    }

    .country-option .flag-icon {
      font-size: 18px;
      line-height: 1;
      min-width: 24px;
      text-align: center;
    }

    .date-input-group {
      position: relative;
      display: flex;
      align-items: center;
    }

    .date-input-group input[type="text"] {
      padding-right: 40px;
    }

    .date-input-group input[type="date"] {
      position: absolute;
      right: 10px;
      width: 24px;
      opacity: 0;
      cursor: pointer;
    }

    .date-picker-icon {
      position: absolute;
      right: 12px;
      color: #64748b;
      pointer-events: none;
    }

    .phone-input-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .phone-prefix {
      background-color: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 600;
      color: #475569;
      min-width: 65px;
      text-align: center;
      user-select: none;
    }

    .form-row input:focus,
    .form-row select:focus,
    .form-row textarea:focus {
      border-color: #0284c7;
    }

    .form-row textarea {
      height: 110px;
      resize: vertical;
    }

    .btn-container {
      display: flex;
      justify-content: flex-start;
      margin-top: 25px;
    }

    .btn-register {
      background-color: #00b074;
      color: #ffffff;
      border: none;
      padding: 12px 30px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: background 0.2s;
      text-transform: uppercase;
    }

    .btn-register:hover {
      background-color: #009663;
    }

    .alert-message {
      display: none;
      padding: 12px;
      border-radius: 4px;
      font-size: 14px;
      margin-bottom: 20px;
      text-align: center;
    }

    .alert-danger {
      background-color: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .alert-success {
      background-color: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    @media (max-width: 580px) {
      .form-row {
        grid-template-columns: 1fr;
        gap: 6px;
      }
    }
  </style>
</head>
<body>

  <div class="registration-container">
    
    <a href="/login.html" class="close-btn"><i class="fa-solid fa-xmark"></i></a>

    <h2>Online Banking Registration</h2>

    <div id="alertBox" class="alert-message"></div>

    <form id="registerForm">
      
      <!-- First Name -->
      <div class="form-row">
        <label for="firstName">First Name</label>
        <input type="text" id="firstName" name="firstName" placeholder="Your First Name" required>
      </div>

      <!-- Last Name -->
      <div class="form-row">
        <label for="lastName">Last Name</label>
        <input type="text" id="lastName" name="lastName" placeholder="Your last name.." required>
      </div>

      <!-- Username Added -->
      <div class="form-row">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Choose a unique username" required>
      </div>

      <!-- Email Address -->
      <div class="form-row">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="Your Email Address" required>
      </div>

      <!-- Country of Origin -->
      <div class="form-row">
        <label for="countrySearch">Country of Origin</label>
        <div class="searchable-select-container">
          <input type="text" id="countrySearch" class="country-search-input" placeholder="Type or select country..." autocomplete="off" required>
          <input type="hidden" id="country" name="country" required>
          <div id="countryDropdownList" class="country-dropdown-list"></div>
        </div>
      </div>

      <!-- Phone Number -->
      <div class="form-row">
        <label for="phone">Phone Number</label>
        <div class="phone-input-group">
          <span class="phone-prefix" id="phonePrefix">+---</span>
          <input type="tel" id="phone" name="phone" placeholder="Select a country first" maxlength="15" disabled required>
        </div>
      </div>

      <!-- Gender -->
      <div class="form-row">
        <label for="gender">Gender</label>
        <select id="gender" name="gender" required>
          <option value="Male" selected>Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <!-- Date of Birth -->
      <div class="form-row">
        <label for="dob">Date of Birth</label>
        <div class="date-input-group">
          <input type="text" id="dob" name="dob" placeholder="YYYY-MM-DD or select..." maxlength="10" autocomplete="off" required>
          <input type="date" id="dobPicker" aria-label="Select date from calendar">
          <i class="fa-regular fa-calendar date-picker-icon"></i>
        </div>
      </div>

      <!-- Full Home Address -->
      <div class="form-row textarea-row">
        <label for="address">Full Home Address</label>
        <textarea id="address" name="address" placeholder="55 Trinity Ave SW # 1350, Atlanta, GA 30303, United States" required></textarea>
      </div>

      <!-- Account Type -->
      <div class="form-row">
        <label for="accountType">Account Type</label>
        <select id="accountType" name="accountType" required>
          <option value="" disabled selected>Account Type</option>
          <option value="Savings">Savings Account</option>
          <option value="Checking">Checking Account</option>
          <option value="Business">Business Account</option>
        </select>
      </div>

      <!-- Account Currency -->
      <div class="form-row">
        <label for="currency">Account Currency</label>
        <select id="currency" name="currency" required>
          <option value="" disabled selected>Select</option>
          <option value="USD">USD ($)</option>
          <option value="EUR">EUR (€)</option>
          <option value="GBP">GBP (£)</option>
          <option value="CAD">CAD ($)</option>
          <option value="KES">KES (KSh)</option>
          <option value="AUD">AUD ($)</option>
          <option value="JPY">JPY (¥)</option>
          <option value="ZAR">ZAR (R)</option>
          <option value="INR">INR (₹)</option>
          <option value="NGN">NGN (₦)</option>
          <option value="GHS">GHS (₵)</option>
          <option value="CHF">CHF (CHF)</option>
          <option value="CNY">CNY (¥)</option>
          <option value="AED">AED (د.إ)</option>
          <option value="SAR">SAR (ر.س)</option>
        </select>
      </div>

      <!-- Choose Password -->
      <div class="form-row">
        <label for="password">Choose Password</label>
        <input type="password" id="password" name="password" placeholder="***********" required>
      </div>

      <!-- Action Button -->
      <div class="btn-container">
        <button type="submit" class="btn-register" id="registerBtn">REGISTER</button>
      </div>

    </form>
  </div>

    const registerForm = document.getElementById('registerForm');
    const alertBox = document.getElementById('alertBox');
    const registerBtn = document.getElementById('registerBtn');
    
    const countrySearch = document.getElementById('countrySearch');
    const countryHidden = document.getElementById('country');
    const countryDropdownList = document.getElementById('countryDropdownList');

    const phonePrefix = document.getElementById('phonePrefix');
    const phoneInput = document.getElementById('phone');
    const currencySelect = document.getElementById('currency');
    
    const dobInput = document.getElementById('dob');
    const dobPicker = document.getElementById('dobPicker');

    let selectedCountryData = null;

    function renderCountryOptions(filter = '') {
      countryDropdownList.innerHTML = '';
      const filtered = countriesData.filter(c => c.name.toLowerCase().includes(filter.toLowerCase()));

      if (filtered.length === 0) {
        countryDropdownList.style.display = 'none';
        return;
      }

      filtered.forEach(c => {
        const div = document.createElement('div');
        div.className = 'country-option';
        div.innerHTML = `
          <span class="flag-icon">${c.flag}</span>
          <span>${c.name} <strong style="color: #64748b; font-weight: 500;">(${c.dialCode})</strong></span>
        `;
        div.addEventListener('click', () => {
          selectCountry(c);
        });
        countryDropdownList.appendChild(div);
      });

      countryDropdownList.style.display = 'block';
    }

    function selectCountry(c) {
      selectedCountryData = c;
      countrySearch.value = `${c.flag}  ${c.name}`;
      countryHidden.value = c.code;
      countryDropdownList.style.display = 'none';

      phonePrefix.textContent = c.dialCode;
      phoneInput.disabled = false;
      phoneInput.setAttribute('maxlength', c.digits);
      phoneInput.setAttribute('placeholder', c.placeholder);
      phoneInput.value = '';

      if (c.currency) {
        let currencyOptionExists = false;
        for (let i = 0; i < currencySelect.options.length; i++) {
          if (currencySelect.options[i].value === c.currency) {
            currencySelect.value = c.currency;
            currencyOptionExists = true;
            break;
          }
        }
        if (!currencyOptionExists) {
          const newOpt = document.createElement('option');
          newOpt.value = c.currency;
          newOpt.textContent = c.currency;
          currencySelect.appendChild(newOpt);
          currencySelect.value = c.currency;
        }
      }
    }

    countrySearch.addEventListener('focus', () => {
      renderCountryOptions(countrySearch.value.replace(/^[^\w\s]+\s*/, ''));
    });

    countrySearch.addEventListener('input', () => {
      selectedCountryData = null;
      countryHidden.value = '';
      const rawQuery = countrySearch.value.replace(/^[^\w\s]+\s*/, '');
      renderCountryOptions(rawQuery);
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.searchable-select-container')) {
        countryDropdownList.style.display = 'none';
        if (!selectedCountryData && countrySearch.value.trim() !== '') {
          countrySearch.value = '';
        }
      }
    });

    dobPicker.addEventListener('change', () => {
      if (dobPicker.value) {
        dobInput.value = dobPicker.value;
      }
    });

    dobInput.addEventListener('input', () => {
      if (dobInput.value.length > 10) {
        dobInput.value = dobInput.value.slice(0, 10);
      }
    });

    phoneInput.addEventListener('input', () => {
      if (!selectedCountryData) return;
      const maxDigits = selectedCountryData.digits || 15;
      phoneInput.value = phoneInput.value.replace(/\D/g, '').slice(0, maxDigits);
    });

    function showAlert(message, type = 'danger') {
      alertBox.textContent = message;
      alertBox.className = `alert-message alert-${type}`;
      alertBox.style.display = 'block';
    }

    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      if (!selectedCountryData) {
        showAlert('Please select a valid country from the list.');
        countrySearch.focus();
        return;
      }

      const expectedDigits = selectedCountryData.digits;
      const rawPhone = phoneInput.value.trim();

      if (expectedDigits && rawPhone.length !== expectedDigits) {
        showAlert(`Phone number for this country must be exactly ${expectedDigits} digits.`);
        phoneInput.focus();
        return;
      }

      const prefix = phonePrefix.textContent;
      const fullPhoneNumber = prefix + rawPhone;

      const formData = {
        firstName: document.getElementById('firstName').value.trim(),
        lastName: document.getElementById('lastName').value.trim(),
        username: document.getElementById('username').value.trim(),
        email: document.getElementById('email').value.trim(),
        country: countryHidden.value,
        phone: fullPhoneNumber,
        gender: document.getElementById('gender').value,
        dob: dobInput.value.trim(),
        address: document.getElementById('address').value.trim(),
        accountType: document.getElementById('accountType').value,
        currency: currencySelect.value,
        password: document.getElementById('password').value
      };

      registerBtn.disabled = true;
      registerBtn.textContent = 'Processing...';

      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(formData)
        });

        const data = await response.json();

        if (response.ok) {
          showAlert('Registration successful! Redirecting to login...', 'success');
          setTimeout(() => {
            window.location.href = '/login.html';
          }, 1500);
        } else {
          showAlert(data.message || 'Registration failed. Please check your details.');
          registerBtn.disabled = false;
          registerBtn.textContent = 'REGISTER';
        }
      } catch (err) {
        console.error('Registration Error:', err);
        showAlert('Unable to connect to the server. Please try again later.');
        registerBtn.disabled = false;
        registerBtn.textContent = 'REGISTER';
      }
    });
  </script>
