<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Iber Capital Bank</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Saira', sans-serif;
    }

    body {
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    /* Logo Styling */
    .logo-container {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo-container img {
      max-width: 220px;
      height: auto;
    }

    /* Header & Underline Accent */
    .login-header {
      margin-bottom: 25px;
    }

    .login-header h2 {
      font-size: 26px;
      color: #1a365d;
      font-weight: 700;
    }

    .accent-bar {
      width: 40px;
      height: 6px;
      background-color: #0b3c7b;
      margin-top: 8px;
      border-radius: 2px;
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      color: #334155;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .input-wrapper i {
      font-size: 24px;
      color: #1e3a8a;
      width: 30px;
      text-align: center;
    }

    .input-wrapper input {
      flex: 1;
      padding: 10px 14px;
      font-size: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-wrapper input:focus {
      border-color: #0b3c7b;
    }

    .input-wrapper input::placeholder {
      color: #94a3b8;
    }

    /* Action Buttons Row */
    .actions-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 30px;
      gap: 10px;
    }

    .btn-login {
      background-color: #003366;
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-login:hover {
      background-color: #002244;
    }

    .reset-link {
      color: #0284c7;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }

    .reset-link:hover {
      text-decoration: underline;
    }

    .btn-enroll {
      background-color: #e11d48;
      color: #ffffff;
      text-decoration: none;
      padding: 8px 18px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 14px;
      transition: background 0.2s;
    }

    .btn-enroll:hover {
      background-color: #be123c;
    }

    /* Alert Box */
    .alert-message {
      display: none;
      padding: 10px;
      border-radius: 4px;
      font-size: 13px;
      margin-bottom: 15px;
      text-align: center;
    }

    .alert-danger {
      background-color: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .alert-success {
      background-color: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
    }
  </style>
</head>
<body>

  <div class="login-container">
    
    <!-- Logo -->
    <div class="logo-container">
      <a href="/index.html">
        <img src="/Frontend/images/logo-blue.png" alt="Iber Capital Bank Logo" onerror="this.src='/images/logo-blue.png'">
      </a>
    </div>

    <!-- Title -->
    <div class="login-header">
      <h2>Login Form</h2>
      <div class="accent-bar"></div>
    </div>

    <!-- Feedback Message Box -->
    <div id="alertBox" class="alert-message"></div>

    <!-- Login Form -->
    <form id="loginForm">
      
      <!-- Username / Email Field -->
      <div class="form-group">
        <label for="identifier">Username/Email</label>
        <div class="input-wrapper">
          <i class="fa-regular fa-user"></i>
          <input type="text" id="identifier" name="identifier" placeholder="Enter your username or email" required>
        </div>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-fingerprint"></i>
          <input type="password" id="password" name="password" placeholder="**********" required>
        </div>
      </div>

      <!-- Actions Bar -->
      <div class="actions-row">
        <button type="submit" class="btn-login" id="loginBtn">Log me in</button>
        <a href="#" class="reset-link">Reset Login?</a>
        <a href="/register.html" class="btn-enroll">Enroll</a>
      </div>

    </form>
  </div>

  <!-- Authentication Request Script -->
  <script>
    const loginForm = document.getElementById('loginForm');
    const alertBox = document.getElementById('alertBox');
    const loginBtn = document.getElementById('loginBtn');

    function showAlert(message, type = 'danger') {
      alertBox.textContent = message;
      alertBox.className = `alert-message alert-${type}`;
      alertBox.style.display = 'block';
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const identifier = document.getElementById('identifier').value.trim();
      const password = document.getElementById('password').value;

      loginBtn.disabled = true;
      loginBtn.textContent = 'Authenticating...';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ identifier, password })
        });

        const data = await response.json();

        if (response.ok) {
          showAlert('Login successful! Redirecting...', 'success');
          
          // Save JWT in localStorage under both keys to ensure compatibility across pages
          if (data.token) {
            localStorage.setItem('authToken', data.token);
            localStorage.setItem('token', data.token);
          }

          // Check if the logged-in user is the admin
          const loggedInEmail = data.user && data.user.email ? data.user.email.toLowerCase() : '';
          
          setTimeout(() => {
            if (loggedInEmail === 'admin@ibercapital.com' || identifier.toLowerCase() === 'admin@ibercapital.com') {
              window.location.href = '/admin/dashboard';
            } else {
              window.location.href = '/dashboard.html';
            }
          }, 1200);

        } else {
          showAlert(data.message || 'Invalid username or password.');
          loginBtn.disabled = false;
          loginBtn.textContent = 'Log me in';
        }
      } catch (err) {
        console.error('Login error:', err);
        showAlert('Unable to connect to the server. Please try again.');
        loginBtn.disabled = false;
        loginBtn.textContent = 'Log me in';
      }
    });
  </script>

</body>
</html>
