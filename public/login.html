<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Swift Royal Investment Bank</title>

  <link href="https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Saira', sans-serif;
    }

    body {
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    /* Bank Title Styling */
    .bank-title {
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      color: #1a365d;
      margin-bottom: 15px;
      letter-spacing: 0.5px;
    }

    /* Logo Styling */
    .logo-container {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo-container img {
      max-width: 220px;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    /* Header & Underline Accent */
    .login-header {
      margin-bottom: 25px;
    }

    .login-header h2 {
      font-size: 26px;
      color: #1a365d;
      font-weight: 700;
    }

    .accent-bar {
      width: 40px;
      height: 6px;
      background-color: #0b3c7b;
      margin-top: 8px;
      border-radius: 2px;
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      color: #334155;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .input-wrapper i {
      font-size: 24px;
      color: #1e3a8a;
      width: 30px;
      text-align: center;
    }

    .input-wrapper input {
      flex: 1;
      padding: 10px 14px;
      font-size: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-wrapper input:focus {
      border-color: #0b3c7b;
    }

    .input-wrapper input::placeholder {
      color: #94a3b8;
    }

    /* Timer Display Style */
    .timer-display {
      font-size: 13px;
      font-weight: 600;
      color: #dc2626;
      margin-top: 6px;
      text-align: right;
    }

    .timer-display.expired {
      color: #64748b;
    }

    /* Action Buttons Row */
    .actions-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 30px;
      gap: 10px;
    }

    .btn-login {
      background-color: #003366;
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-login:hover {
      background-color: #002244;
    }

    .btn-login:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }

    .reset-link {
      color: #0284c7;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }

    .reset-link:hover {
      text-decoration: underline;
    }

    .btn-enroll {
      background-color: #e11d48;
      color: #ffffff;
      text-decoration: none;
      padding: 8px 18px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 14px;
      transition: background 0.2s;
    }

    .btn-enroll:hover {
      background-color: #be123c;
    }

    /* Alert Box */
    .alert-message {
      display: none;
      padding: 10px;
      border-radius: 4px;
      font-size: 13px;
      margin-bottom: 15px;
      text-align: center;
    }

    .alert-danger {
      background-color: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .alert-success {
      background-color: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
    }
  </style>
</head>
<body>

  <div class="login-container">
    
    <div class="bank-title">Swift Royal Investment Bank</div>

    <div class="logo-container">
      <a href="/index.html">
        <img src="/images/logo-white.png" alt="Swift Royal Investment Bank Logo" onerror="this.style.display='none'">
      </a>
    </div>

    <div class="login-header">
      <h2 id="formTitle">Login Form</h2>
      <div class="accent-bar"></div>
    </div>

    <div id="alertBox" class="alert-message"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="identifier">Username/Email</label>
        <div class="input-wrapper">
          <i class="fa-regular fa-user"></i>
          <input type="text" id="identifier" name="identifier" placeholder="Enter your username or email" required>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-fingerprint"></i>
          <input type="password" id="password" name="password" placeholder="**********" required>
        </div>
      </div>

      <div class="actions-row">
        <button type="submit" class="btn-login" id="loginBtn">Log me in</button>
        <a href="#" id="showResetEmailForm" class="reset-link">Reset Login?</a>
        <a href="/register.html" class="btn-enroll">Enroll</a>
      </div>
    </form>

    <form id="resetEmailForm" style="display: none;">
      <div class="form-group">
        <label for="resetEmail">Registered Email</label>
        <div class="input-wrapper">
          <i class="fa-regular fa-envelope"></i>
          <input type="email" id="resetEmail" name="resetEmail" placeholder="Enter your account email" required>
        </div>
      </div>

      <div class="actions-row">
        <button type="submit" class="btn-login" id="sendOtpBtn">Confirm & Send OTP</button>
        <a href="#" id="backToLoginFromEmail" class="reset-link">Back to Login</a>
      </div>
    </form>

    <form id="verifyOtpForm" style="display: none;">
      <div class="form-group">
        <label for="otpCode">Enter 6-digit OTP</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-shield-keyhole"></i>
          <input type="text" id="otpCode" name="otpCode" placeholder="Enter 6-digit OTP" maxlength="6" required>
        </div>
        <div id="otpTimer" class="timer-display">Code expires in: <span id="timeRemaining">02:00</span></div>
      </div>

      <div class="actions-row">
        <button type="submit" class="btn-login" id="verifyOtpBtn">Verify OTP</button>
        <a href="#" id="resendOtpLink" class="reset-link" style="display: none;">Resend OTP</a>
        <a href="#" id="backToEmailForm" class="reset-link">Back</a>
      </div>
    </form>

    <form id="newPasswordForm" style="display: none;">
      <div class="form-group">
        <label for="newPassword">New Password (Min 8 Characters)</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="newPassword" name="newPassword" placeholder="Enter new password" minlength="8" required>
        </div>
      </div>

      <div class="actions-row">
        <button type="submit" class="btn-login" id="updatePasswordBtn">Reset Password</button>
      </div>
    </form>

  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const resetEmailForm = document.getElementById('resetEmailForm');
    const verifyOtpForm = document.getElementById('verifyOtpForm');
    const newPasswordForm = document.getElementById('newPasswordForm');
    
    const alertBox = document.getElementById('alertBox');
    const formTitle = document.getElementById('formTitle');

    const showResetEmailForm = document.getElementById('showResetEmailForm');
    const backToLoginFromEmail = document.getElementById('backToLoginFromEmail');
    const backToEmailForm = document.getElementById('backToEmailForm');
    const resendOtpLink = document.getElementById('resendOtpLink');

    const timeRemainingSpan = document.getElementById('timeRemaining');
    const otpTimerBox = document.getElementById('otpTimer');
    const verifyOtpBtn = document.getElementById('verifyOtpBtn');

    let savedEmail = '';
    let verifiedOtp = '';
    let countdownInterval = null;

    function showAlert(message, type = 'danger') {
      alertBox.textContent = message;
      alertBox.className = `alert-message alert-${type}`;
      alertBox.style.display = 'block';
    }

    function hideAllForms() {
      loginForm.style.display = 'none';
      resetEmailForm.style.display = 'none';
      verifyOtpForm.style.display = 'none';
      newPasswordForm.style.display = 'none';
      alertBox.style.display = 'none';
      if (countdownInterval) clearInterval(countdownInterval);
    }

    // Start 2-minute countdown timer function
    function startOtpTimer() {
      if (countdownInterval) clearInterval(countdownInterval);
      
      let totalSeconds = 120; // 2 minutes
      verifyOtpBtn.disabled = false;
      resendOtpLink.style.display = 'none';
      otpTimerBox.classList.remove('expired');

      countdownInterval = setInterval(() => {
        let minutes = Math.floor(totalSeconds / 60);
        let seconds = totalSeconds % 60;

        minutes = minutes < 10 ? '0' + minutes : minutes;
        seconds = seconds < 10 ? '0' + seconds : seconds;

        timeRemainingSpan.textContent = `${minutes}:${seconds}`;

        if (totalSeconds <= 0) {
          clearInterval(countdownInterval);
          timeRemainingSpan.textContent = 'Expired';
          otpTimerBox.classList.add('expired');
          verifyOtpBtn.disabled = true;
          showAlert('OTP has expired. Please click Resend OTP.', 'danger');
          resendOtpLink.style.display = 'inline';
        }

        totalSeconds--;
      }, 1000);
    }

    // View Navigation
    showResetEmailForm.addEventListener('click', (e) => {
      e.preventDefault();
      hideAllForms();
      resetEmailForm.style.display = 'block';
      formTitle.textContent = 'Reset Account';
    });

    backToLoginFromEmail.addEventListener('click', (e) => {
      e.preventDefault();
      hideAllForms();
      loginForm.style.display = 'block';
      formTitle.textContent = 'Login Form';
    });

    backToEmailForm.addEventListener('click', (e) => {
      e.preventDefault();
      hideAllForms();
      resetEmailForm.style.display = 'block';
      formTitle.textContent = 'Reset Account';
    });

    // Handle Resend OTP Click
    resendOtpLink.addEventListener('click', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';
      resendOtpLink.textContent = 'Resending...';

      try {
        const response = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: savedEmail })
        });
        const data = await response.json();

        if (response.ok) {
          showAlert('A new OTP has been sent to your email.', 'success');
          resendOtpLink.textContent = 'Resend OTP';
          startOtpTimer(); // Restart the 2-minute timer
        } else {
          showAlert(data.message || 'Failed to resend OTP.');
          resendOtpLink.textContent = 'Resend OTP';
        }
      } catch (err) {
        showAlert('Network error. Please try again.');
        resendOtpLink.textContent = 'Resend OTP';
      }
    });

    // Login Form Submission
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const identifier = document.getElementById('identifier').value.trim();
      const password = document.getElementById('password').value;
      const loginBtn = document.getElementById('loginBtn');

      loginBtn.disabled = true;
      loginBtn.textContent = 'Authenticating...';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier, password })
        });

        const data = await response.json();

        if (response.ok) {
          if (data.token) {
            localStorage.setItem('authToken', data.token);
            localStorage.setItem('token', data.token);
          }

          // Check if admin role or target email matches to direct straight to private admin panel
          const userEmail = data.user && data.user.email ? data.user.email.toLowerCase() : '';
          const userRole = data.user && data.user.role ? data.user.role.toUpperCase() : '';
          
          if (userRole === 'ADMIN' || userEmail === 'emmanuelbarasa168@gmail.com') {
            window.location.href = '/admin/admin.html';
          } else {
            window.location.href = data.redirectTo || '/dashboard.html';
          }

        } else {
          showAlert(data.message || 'Invalid username or password.');
          loginBtn.disabled = false;
          loginBtn.textContent = 'Log me in';
        }
      } catch (err) {
        console.error('Login error:', err);
        showAlert('Unable to connect to the server. Please try again.');
        loginBtn.disabled = false;
        loginBtn.textContent = 'Log me in';
      }
    });

    // Step 1: Submit Email for OTP Generation
    resetEmailForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';
      const emailInput = document.getElementById('resetEmail').value.trim();
      const sendOtpBtn = document.getElementById('sendOtpBtn');

      sendOtpBtn.disabled = true;
      sendOtpBtn.textContent = 'Confirming Email...';

      try {
        const response = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: emailInput })
        });
        const data = await response.json();

        if (response.ok) {
          savedEmail = emailInput;
          showAlert('Email confirmed. OTP sent (Expires in 2 mins).', 'success');
          setTimeout(() => {
            hideAllForms();
            verifyOtpForm.style.display = 'block';
            formTitle.textContent = 'Verify OTP';
            startOtpTimer(); // Start timer once OTP form displays
          }, 1000);
        } else {
          showAlert(data.message || 'Email record not found.');
          sendOtpBtn.disabled = false;
          sendOtpBtn.textContent = 'Confirm & Send OTP';
        }
      } catch (err) {
        showAlert('Network error. Please try again.');
        sendOtpBtn.disabled = false;
        sendOtpBtn.textContent = 'Confirm & Send OTP';
      }
    });

    // Step 2: Verify OTP Submission
    verifyOtpForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';
      const otpInput = document.getElementById('otpCode').value.trim();

      verifyOtpBtn.disabled = true;
      verifyOtpBtn.textContent = 'Verifying OTP...';

      try {
        const response = await fetch('/api/auth/verify-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: savedEmail, code: otpInput })
        });
        const data = await response.json();

        if (response.ok) {
          if (countdownInterval) clearInterval(countdownInterval);
          verifiedOtp = otpInput;
          showAlert('OTP verified successfully!', 'success');
          setTimeout(() => {
            hideAllForms();
            newPasswordForm.style.display = 'block';
            formTitle.textContent = 'Create New Password';
          }, 1000);
        } else {
          showAlert(data.message || 'Invalid or expired OTP code.');
          verifyOtpBtn.disabled = false;
          verifyOtpBtn.textContent = 'Verify OTP';
        }
      } catch (err) {
        showAlert('Network error. Please try again.');
        verifyOtpBtn.disabled = false;
        verifyOtpBtn.textContent = 'Verify OTP';
      }
    });

    // Step 3: New Password Submission
    newPasswordForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';
      const newPasswordInput = document.getElementById('newPassword').value;
      const updatePasswordBtn = document.getElementById('updatePasswordBtn');

      if (newPasswordInput.length < 8) {
        showAlert('Password must be at least 8 characters long.');
        return;
      }

      updatePasswordBtn.disabled = true;
      updatePasswordBtn.textContent = 'Updating Password...';

      try {
        const response = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: savedEmail, otp: verifiedOtp, newPassword: newPasswordInput })
        });
        const data = await response.json();

        if (response.ok) {
          showAlert('Password reset successful! Redirecting to login...', 'success');
          setTimeout(() => {
            hideAllForms();
            loginForm.style.display = 'block';
            formTitle.textContent = 'Login Form';
          }, 1500);
        } else {
          showAlert(data.message || 'Failed to update password.');
          updatePasswordBtn.disabled = false;
          updatePasswordBtn.textContent = 'Reset Password';
        }
      } catch (err) {
        showAlert('Network error. Please try again.');
        updatePasswordBtn.disabled = false;
        updatePasswordBtn.textContent = 'Reset Password';
      }
    });
  </script>

</body>
</html>
